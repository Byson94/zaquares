[project]
name = "zaquares"
version = "0.1.0"
description = "A research on Water Quality Assessment"
readme = "README.md"
authors = [
    { name = "Byson94", email = "dev.byson94@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "xgboost-cpu>=3.4.1",
]

[project.scripts]
wpi = "zaquares.wpi:main"
zape = "zaquares.zape:main"
score_dataset = "zaquares.score_dataset:main"
create_plots = "zaquares.create_plots:main"
test_zape = "zaquares.test_zape:main"
deploy_model = "zaquares.deploy_model:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.pyright]
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-csv-params>=2.3.1",
]
